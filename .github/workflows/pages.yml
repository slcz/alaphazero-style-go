# pages.yml — build the wasm engine and deploy the web GUI to GitHub
# Pages. The site root mirrors the repo layout (web/ + engine/build/wasm/)
# so the workers' ../../engine/build/wasm imports resolve; the GUI lives
# at https://slcz.github.io/alaphazero-style-go/web/.
#
# The net itself is NOT built or stored here: the GUI fetches
# web/net-{b}.onnx (and the optional web/latest.json pointer) from the
# HuggingFace model repo at load time. Only the engine + GUI ship in
# this Pages artifact.
name: pages

on:
  push:
    branches: [gui, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: build wasm engine
        run: make -C engine wasm wasm-rules
      - name: assemble site
        run: |
          mkdir -p site/engine/build
          cp -r web site/web
          cp -r engine/build/wasm site/engine/build/wasm
          rm -f site/web/serve.py site/web/build.sh
          touch site/.nojekyll
          # the site root is the repo root; the GUI lives at /web/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=./web/">
          <a href="./web/">gogui</a>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
