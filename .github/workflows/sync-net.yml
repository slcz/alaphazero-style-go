# sync-net.yml — publish the newest HuggingFace checkpoint as a web net.
#
# Once a day (and on demand), find the newest `itNNN-train.pt` in the HF
# model repo, export it to per-size ONNX, and publish a `net-itNNN`
# GitHub release. The pages workflow then copies that release into the
# site; the GUI reads web/net/latest.json, so no code change is needed.
#
# Requires an `HF_TOKEN` Actions secret while chriszhang01/gonet is
# private. If the repo is public, no secret is needed. Without access
# the job warns and exits without touching the live site.
name: sync-net

on:
  schedule:
    - cron: "41 7 * * *"       # daily, 07:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-net
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should: ${{ steps.check.outputs.should }}
      iteration: ${{ steps.check.outputs.iteration }}
      path: ${{ steps.check.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          python scripts/find_latest_checkpoint.py \
            --repo chriszhang01/gonet --dir checkpoints \
            --json /tmp/ckpt.json || rc=$?
          if [ "$rc" -eq 2 ] && [ -z "${HF_TOKEN:-}" ]; then
            echo "::warning::HF model repo is private and no HF_TOKEN secret is set; skipping the sync"
            echo "should=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "checkpoint discovery failed (rc=$rc)"
            exit "$rc"
          fi
          it=$(python3 -c 'import json; print(json.load(open("/tmp/ckpt.json"))["iteration"])')
          path=$(python3 -c 'import json; print(json.load(open("/tmp/ckpt.json"))["path"])')
          echo "iteration=$it" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "newest checkpoint: $path (it$(printf '%03d' "$it"))"
          if gh release view "net-it$it" --repo "$GITHUB_REPOSITORY" \
               >/dev/null 2>&1; then
            echo "net-it$it is already published"
            echo "should=false" >> "$GITHUB_OUTPUT"
          else
            echo "should=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: discover
    if: needs.discover.outputs.should == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install export deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install onnx onnxruntime huggingface_hub
      - name: build native engine (parity gate)
        run: make -C engine all
      - name: download latest checkpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/find_latest_checkpoint.py \
            --repo chriszhang01/gonet --dir checkpoints \
            --download "/tmp/it${{ needs.discover.outputs.iteration }}-train.pt"
      - name: publish web net release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_web_net.py \
            "/tmp/it${{ needs.discover.outputs.iteration }}-train.pt" \
            --tag "net-it${{ needs.discover.outputs.iteration }}" \
            --checkpoint-url "https://huggingface.co/chriszhang01/gonet/blob/main/${{ needs.discover.outputs.path }}" \
            --github-release --repo "$GITHUB_REPOSITORY"
      - name: deploy the new net
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # releases created with GITHUB_TOKEN do not trigger other
          # workflows, so ask Pages to rebuild explicitly
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}"
