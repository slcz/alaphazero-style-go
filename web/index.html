<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gogui</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.45 system-ui, sans-serif;
    margin: 0; display: flex; min-height: 100vh;
    align-items: flex-start; justify-content: center; gap: 24px;
    padding: 24px; box-sizing: border-box;
    background: #20242b; color: #e8e8e8;
  }
  canvas { border-radius: 8px; box-shadow: 0 4px 24px #0008; }
  #side { display: flex; flex-direction: column; gap: 10px; min-width: 210px; }
  #side h1 { font-size: 18px; margin: 0; }
  #side label { font-size: 12px; color: #aaa; }
  select, input[type=text], input[type=number] {
    background: #2a2f38; color: #e8e8e8; border: 1px solid #444;
    border-radius: 6px; padding: 4px 6px; font: inherit;
  }
  button {
    background: #3a6ea5; color: #fff; border: 0; border-radius: 6px;
    padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button.secondary { background: #4a5160; }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.4em; color: #ffd479; }
  #result { font-size: 20px; font-weight: 700; min-height: 1.3em; }
  #moves {
    flex: 0 1 auto; width: 210px; height: 180px; overflow-y: auto;
    background: #171a1f; border: 1px solid #333; border-radius: 6px;
    padding: 6px 8px; font: 12px/1.5 ui-monospace, monospace;
    white-space: pre;
  }
  .row { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
  <canvas id="board" width="640" height="640"></canvas>
  <div id="side">
    <h1>gogui <span style="font-weight:400;font-size:12px">wasm · GTP</span></h1>
    <div class="row">
      <label>size <select id="size">
        <option>7</option><option selected>9</option><option>13</option>
        <option>19</option>
      </select></label>
      <label>komi <input id="komi" type="text" value="7.5" size="3"></label>
    </div>
    <div class="row">
      <label>you play
        <label><input type="radio" name="col" id="color-b" checked> black</label>
        <label><input type="radio" name="col" id="color-w"> white</label>
      </label>
    </div>
    <div class="row">
      <label>sims <input id="sims" type="number" value="200" min="16"
             max="8000" step="50" style="width:5em"></label>
    </div>
    <button id="new">New Game</button>
    <div class="row">
      <button id="pass" class="secondary">Pass</button>
      <button id="resign" class="secondary">Resign</button>
    </div>
    <div id="status">loading engine…</div>
    <div id="result"></div>
    <div id="ply"></div>
    <div id="wrbar" style="height:14px;border-radius:7px;overflow:hidden;
         border:1px solid #555;display:flex">
      <div id="wrfill" style="width:50%;background:#15181d;
           transition:width .4s"></div>
      <div style="flex:1;background:#ececec"></div>
    </div>
    <div id="wrtext" style="font-size:11px;color:#9ab">B 50% · score 0</div>
    <div id="perf" style="font-size:11px;color:#9ab"></div>
    <div id="moves"></div>
  </div>
  <script type="module" src="app/main.js"></script>
</body>
</html>
